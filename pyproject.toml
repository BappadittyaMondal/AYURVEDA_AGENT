[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayurveda_agent"
version = "3.1.0"
description = "Autonomous Zero-Trust Clinical Ayurvedic Hospital Information System (A-HIS), EHR & CDSS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AYURVEDA_AGENT Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
